const common=['AI 상담원 1명','전용 링크·QR','비회원 상담','상담 내역 열람','직접 프롬프트·모범 답변','말투 설정','업체명·로고','공지·구매처 안내','미학습 질문 확인','관리자 직접 답변','기본 자동·수동 설정'];

let st={brand:'OO 스냅',tone:'자연스럽고 정중하게',emoji:false,prompt:'등록된 자료를 기준으로 답변하고, 모르는 질문은 담당자 확인으로 안내하세요.',notice:'촬영 예약 및 공식 구매처 안내',link:'https://www.myrealtrip.com/',fields:defaultFields,modes:taskNames.map((_,i)=>i<4?'자동':'수동'),files:[],credits:20,test:0,plan:2,selected:[],answers:[],day:5,trained:false,...JSON.parse(localStorage.getItem('csai-demo')||'{}')};
const money=n=>n.toLocaleString('ko-KR')+'원'; const save=()=>localStorage.setItem('csai-demo',JSON.stringify(st));const go=p=>location.hash=p;const modal=(title,body)=>{document.body.insertAdjacentHTML('beforeend',`<div class="modal" onclick="if(event.target===this)this.remove()"><div class="card"><h2>${title}</h2><p>${body}</p><button class="primary" onclick="this.closest('.modal').remove()">확인</button></div></div>`)};
const button=(s,act,cl='')=>`<button class="${cl}" onclick="${act}">${s}</button>`;const pageTop=(title,sub)=>`<div class="top"><div><h1>${title}</h1><p class="muted">${sub}</p></div><span class="tag">UI 데모 · 결제 없음</span></div>`;
const card=(title,body)=>`<section class="card"><h2>${title}</h2>${body}</section>`;const label=(t,html)=>`<label class="label">${t}</label>${html}`; const select=(arr,value,act)=>`<select onchange="${act}">${arr.map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select>`;
const routes=[['inbox','상담 목록'],['preview','채팅 미리보기'],['education','AI 교육시키기'],['calendar','일정표 보기'],['customers','고객·업무 관리'],['channels','외부 채널 연동'],['alerts','알림'],['settings','설정'],['pricing','요금제 및 결제']];
function shell(p,content){return `<div class="layout"><aside><div class="brand"><b>CS</b> AI</div><nav>${routes.map(([id,n])=>`<button class="${p===id?'active':''}" onclick="go('${id}')">${n}${['calendar','customers','channels'].includes(id)?'<span class="lock">유료</span>':''}</button>`).join('')}</nav><div style="margin-top:25px">${button('로그아웃 · 데모',"go('home')")}</div></aside><main>${content}</main></div>`}
function phone(test=false){return `<div class="phone"><div class="phone-head"><div class="avatar">CS</div><div><strong>${esc(st.brand)} 고객센터</strong><div class="muted">24시간 AI 상담</div></div></div><div class="notice"><details><summary>${esc(st.notice)}</summary><a href="${/^https:\/\//.test(st.link)?esc(st.link):'#'}" target="_blank" rel="noopener">공식 구매처 바로가기</a></details></div><div class="messages" id="msgs"><div class="muted" style="text-align:center">오늘</div><div class="bubble">안녕하세요. 무엇을 도와드릴까요?</div>${test?'':`<div class="bubble user">예약하려고 하는데요.</div><div class="bubble">네, 원하시는 날짜와 시간, 촬영 장소를 알려주시겠어요?</div>`}</div><form class="compose" onsubmit="event.preventDefault();send(${test})"><input id="msg" placeholder="메시지를 입력하세요" maxlength="1000" required><button class="primary">전송</button></form><div class="phone-foot">AI 상담원이 응대합니다 · 데모</div></div>`}
function send(test){let msg=$('#msg').value.trim();if(!msg)return;if(test&&st.test>=1){modal('상담 테스트 이용 안내','첫 답변 무료 사용이 끝났습니다. <a href="#pricing" onclick="this.closest(\'.modal\').remove()">요금제 보기</a>');return}let el=$('#msgs');el.insertAdjacentHTML('beforeend',`<div class="bubble user">${esc(msg)}</div>`);let ans=/취소|환불/.test(msg)?'어느 플랫폼에서 결제하셨나요? 스마트스토어, 마이리얼트립 등 구매처를 알려주세요.':/마이리얼트립/.test(msg)?'마이리얼트립에서 구매하셨다면 해당 플랫폼의 예약 내역에서 취소 절차를 확인해 주세요.':/예약|촬영/.test(msg)?'희망하시는 날짜와 시간, 촬영 장소를 알려주세요. 실제 가능 여부는 담당자 확인이 필요합니다.': '해당 문의는 담당자 확인이 필요합니다. 확인 후 안내해 드리겠습니다.';el.insertAdjacentHTML('beforeend',`<div class="bubble">${esc(ans)}</div>`);$('#msg').value='';el.scrollTop=el.scrollHeight;if(test){st.test++;save()}}
function home(){return `<div class="hero"><div class="hero-inner"><div class="brand"><b>CS</b> AI</div><span class="tag">AI 고객 상담 매니저</span><h1>나처럼 상담하는 AI</h1><p class="muted" style="font-size:15px;line-height:1.8;margin:0 0 30px">직접 교육하고, 링크 하나로 시작하세요.<br>당신의 고객 상담을 대신합니다.</p><div class="stack"><button class="google" onclick="go('education')">G　Google로 시작하기 (데모)</button><button class="naver" onclick="modal('준비 중','네이버 로그인은 준비 중입니다.')">N　네이버로 시작하기</button><button class="kakao" onclick="modal('준비 중','카카오 로그인은 준비 중입니다.')">●　카카오로 시작하기</button></div><p class="muted" style="margin-top:22px">이용약관 · 개인정보처리방침 (구현 예정)</p><small>실제 OAuth가 연결되지 않은 UI 시연입니다.</small></div></div>`}
function education(){return pageTop('AI 교육시키기','자료와 직접 지침으로 나만의 상담원을 만드세요.')+`<div class="grid">${card('교육 현황',`<div class="row between"><div><div class="price">${st.credits} 크레딧</div><small>최초 무료 20크레딧</small></div><span class="pill">${st.trained?'교육 데모 완료':'교육 준비'}</span></div><div class="banner">실제 교육은 API 연결 후 작동합니다.</div>${button('교육 크레딧 보기',"go('pricing')")}`)}${card('교육 단계',`<p>01 업체 정보　→　02 말투 설정</p><p>03 자료 추가　→　04 규칙 검토</p><p>05 테스트　→　06 상담 활성화</p>${button('말투 설정',"go('style')")} ${button('상담 테스트',"go('test')",'primary')}`)}</div>${card('교육 자료 추가',`<div class="banner">상담 스크린샷 · 이미지 · PDF · DOCX · TXT · XLSX · HWP(변환 필요)</div><input type="file" multiple onchange="st.files.push(...Array.from(this.files).map(f=>f.name));save();render()">${st.files.map(f=>`<div class="line">${esc(f)} <small>파일명만 저장됨</small></div>`).join('')}<p class="muted" style="margin-top:10px">실제 분석 전 예상 크레딧 및 상한 표시. 현재 파일 내용을 전송하지 않습니다.</p>${button('교육 비용 예시',"go('estimate')")}`)}${card('직접 교육 및 프롬프트',`<textarea onchange="st.prompt=this.value;save()">${esc(st.prompt)}</textarea><div class="row" style="margin-top:10px">${button('직접 지침 저장',"save();modal('저장 완료','로컬 데모에 저장했습니다.')")} ${button('교육 분석 시연',"st.trained=true;save();render();modal('교육 시연','실제 AI 분석이나 크레딧 차감은 수행하지 않습니다.')",'primary')}</div>`)}`}
function stylePage(){return pageTop('상담 스타일 설정','말투와 답변 기준을 최초 교육에서 결정합니다.')+card('말투 및 표현',`${label('기본 말투',select(['자연스럽고 정중하게','정중하고 전문적으로','친근하고 편안하게','자료의 기존 말투'],st.tone,'st.tone=this.value;save()'))}<div class="line"><label><input class="check" type="checkbox" ${!st.emoji?'checked':''} onchange="st.emoji=!this.checked;save()"> 이모지 사용하지 않기</label></div><div class="line">✓ 교육 자료 기반 답변　　✓ 미확인 내용 추측 금지</div>${label('직접 상담 지침',`<textarea onchange="st.prompt=this.value;save()">${esc(st.prompt)}</textarea>`)}<div class="banner">예상 말투: 안녕하세요. 해당 상품은 공식 판매처에서 구매 가능합니다.</div>${button('저장하고 교육으로',"save();go('education')",'primary')}`)}
function preview(test=false){return pageTop(test?'AI 상담 테스트':'채팅창 미리보기',test?'첫 답변 1회 무료 · 이후 요금제 안내':'고객은 로그인 없이 상담합니다.')+`<div class="grid"><div>${phone(test)}</div><div>${card(test?'테스트 안내':'전용 상담 링크',test?`<p>무료 답변 ${Math.max(0,1-st.test)}회 남음</p><p class="muted">실제 AI 대신 규칙 기반 샘플 응답을 보여주는 데모입니다.</p>${button('요금제 보기',"go('pricing')",'primary')} ${button('건너뛰기',"go('inbox')")}`:`<p class="muted">배포 후 발급되는 짧은 링크 예시</p><input readonly value="https://example.com/c/a7k2"><img src="qr.png" style="width:120px;margin:12px 0" alt="예시 링크 QR"><p class="muted">예시 QR은 실제 배포 주소가 아닙니다.</p>${button('고객 화면 미리보기',"go('public')",'primary')}`)}${card('상담창 설정',`<p>상단 공지와 구매처 링크만 노출합니다.</p>${button('업체 설정',"go('settings')")}`)}</div></div>`}
function inbox(){return pageTop('상담 목록','모든 채널의 상담과 확인이 필요한 질문을 관리합니다.')+`<div class="grid three">${card('오늘 상담','<div class="price">12건</div><small>예시 데이터</small>')}${card('확인 필요','<div class="price">2건</div><small>미학습 질문</small>')}${card('예약 대기','<div class="price">1건</div><small>담당자 승인</small>')}</div>`+card('최근 상담',`<table><tr><th>고객 / 채널</th><th>문의</th><th>상태</th></tr><tr><td>방문자 013 / 웹</td><td>주말 당일 예약</td><td>교육 필요</td></tr><tr><td>방문자 012 / 톡톡</td><td>촬영 장소 변경</td><td>확인 대기</td></tr><tr><td>방문자 011 / 웹</td><td>환불 구매처 안내</td><td>안내 완료</td></tr></table>${button('미학습 질문 개선',"go('alerts')",'primary')}`)}
function alerts(){return pageTop('알림 및 미학습 질문','새 질문을 직접 답변하거나 지침으로 개선합니다.')+card('새로운 질문',`<span class="pill warn">교육 필요</span><h2 style="margin:12px 0">주말에도 당일 예약이 가능한가요?</h2><div class="banner">AI 답변: 담당자 확인이 필요한 내용입니다.</div>${label('직접 모범 답변','<textarea id="answer" placeholder="예: 주말에는 오전 10시 이전에만 가능합니다."></textarea>')}${button('답변 저장 및 교육 반영',"if($('#answer').value.trim()){st.answers.push($('#answer').value);save();render();modal('저장 완료','모범 답변이 로컬에 저장되었습니다.')}",'primary')} ${button('프롬프트로 교육',"go('education')")}${st.answers.map(a=>`<p class="line">저장된 답변: ${esc(a)}</p>`).join('')}`)+card('알림 채널','<p>관리자 내부 알림 기본 제공 · 웹 푸시 / 이메일 / 알림톡 / SMS는 유료 옵션.</p>')}
function settings(){return pageTop('설정','업체 정보와 업무별 AI 자동·수동 권한을 설정합니다.')+`<div class="grid">${card('업체 정보',`${label('업체명',`<input value="${esc(st.brand)}" onchange="st.brand=this.value;save()">`)}${label('공지사항',`<input value="${esc(st.notice)}" onchange="st.notice=this.value;save()">`)}${label('구매처 링크',`<input value="${esc(st.link)}" onchange="st.link=this.value;save()">`)}${button('상담 스타일',"go('style')")}`)}${card('자동·수동 업무 설정',taskNames.map((t,i)=>`<div class="row between line"><span>${t}</span><div style="width:110px">${select(['자동','수동','OFF'],st.modes[i],`st.modes[${i}]=this.value;save()`)}</div></div>`).join('')+'<small>자동은 등록 정책 및 구매 권한 내에서만 작동합니다.</small>')}</div>`}
function calendar(){let ds=Array.from({length:33},(_,i)=>i-1).map(d=>d<1?'<div></div>':`<button class="day ${st.day===d?'selected':''}" onclick="st.day=${d};save();render()">${d}${[5,8,12,13,19,24,26].includes(d)?'<span class="dot">●</span>':''}</button>`).join('');return pageTop('일정표 보기','확정된 일정만 기본 표시하고 승인 대기는 별도로 관리합니다.')+`<div class="row" style="margin-bottom:14px">${button('맞춤 양식 설정',"go('fields')",'primary')}${button('예약 확정 예시',"go('confirm')")}${button('승인 대기 1건',"modal('승인 대기','실제 예약 승인 기능은 서버 구현 후 사용합니다.')")}</div><div class="grid">${card('2026년 12월',`<div class="calendar">${['일','월','화','수','목','금','토'].map(d=>`<div class="muted">${d}</div>`).join('')}${ds}</div>`)}${card(`12월 ${st.day}일`,st.day===5?`<div class="row between"><strong class="blue">14:00 ~ 15:00</strong><span class="pill">예약 확정</span></div><h2 style="margin-top:14px">김OO · 커플 스냅</h2><p>장소: 부산 해운대　/　2명</p><p>상품: 커플 촬영　/　150,000원</p><p>구매처: 마이리얼트립</p><p>결제: 업체 확인 완료 (예시)</p><p>추가 요청: 자연스러운 야외 촬영</p>${button('상담 내역',"go('inbox')")} ${button('일정 수정',"go('fields')")}`:'<p class="muted">선택한 날짜의 예시 일정이 없습니다.</p>')}</div>`}
function fields(){return pageTop('맞춤 일정 등록 양식','필수 항목, 데이터 형식, 표시 순서를 업체가 설정합니다.')+card('스냅 촬영 양식',`<div class="fieldrow muted"><span>항목 이름</span><span>형식</span><span>필수</span><span></span></div>${st.fields.map((f,i)=>`<div class="fieldrow"><input value="${esc(f.n)}" onchange="st.fields[${i}].n=this.value;save()">${select(['텍스트','날짜','시간','숫자','선택'],f.type,`st.fields[${i}].type=this.value;save()`)}<label><input class="check" type="checkbox" ${f.r?'checked':''} onchange="st.fields[${i}].r=this.checked;save()"></label><button onclick="st.fields.splice(${i},1);save();render()">×</button></div>`).join('')}${button('+ 항목 추가',"st.fields.push({n:'새 항목',type:'텍스트',r:false});save();render()") } ${button('양식 저장',"save();go('calendar')",'primary')}<p class="muted" style="margin-top:12px">실제 구현에서는 필수 시작·종료 시각과 양식 버전을 서버에서 검증합니다.</p>`)}
function confirm(){return pageTop('예약 내용 최종 확인','고객이 확인한 요약과 사업자 정책에 따라 확정 여부를 결정합니다.')+`<div class="grid">${card('고객과 AI 상담',`<div class="bubble user">12월 5일 커플 스냅 하고 싶어요.</div><div class="bubble" style="margin:12px 0">오후 2시 또는 4시가 가능합니다. 장소는 어디로 원하시나요?</div><div class="bubble user">2시 부산 해운대요.</div><div class="bubble" style="margin-top:12px">성함, 연락처와 구매처를 알려주세요.</div>`)}${card('확정 요청서',`<table>${[['고객명','김OO'],['연락처','010-****-1234'],['촬영일','2026-12-05'],['시간','14:00~15:00'],['장소','부산 해운대'],['인원','2명'],['상품','커플 스냅'],['금액','150,000원'],['구매처','마이리얼트립'],['결제','확인 대기']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table><div class="banner">외부 결제 미확인: 예약 확정이 아니라 승인 대기로 처리합니다.</div>${button('확정 요청 (시연)',"modal('요청 시연','실제 예약은 등록되지 않았습니다.')",'primary')}`)}</div>`}
function channels(){return pageTop('상담 채널 연결','하나의 교육 데이터를 여러 채널에서 사용합니다.')+card('연동 채널',`<div class="row between line"><strong>전용 웹 채팅</strong><span class="pill">기본 포함</span></div>${[['네이버 톡톡',4900],['카카오톡 채널',4900],['홈페이지 위젯',2900],['구글 캘린더',2900]].map(([n,p])=>`<div class="row between line"><div><strong>${n}</strong><p class="muted">월 ${money(p)} · 실제 연결 준비 필요</p></div>${button('설정 안내',"modal('연동 안내','외부 플랫폼 계정 권한 및 공식 API 설정 후 실연동이 가능합니다.')")}</div>`).join('')}<div class="banner">네이버 + 카카오 통합 월 7,900원. 실제 상용 연동 및 승인 확인 전 연결 완료 표시 금지.</div>`)}
function estimate(){return pageTop('AI 교육 비용 확인','분석량 기준 예상 크레딧을 먼저 표시합니다.')+card('교육 자료 예상 사용량 (가상 예시)',`<table><tr><th>자료</th><th>예상 크레딧</th></tr><tr><td>상담매뉴얼 PDF · 32p</td><td>42</td></tr><tr><td>상담 스크린샷 · 25장</td><td>38</td></tr><tr><td>상품 가격 XLSX</td><td>15</td></tr></table><p class="line">예상 합계 <strong>95 크레딧</strong></p><p class="line">현재 보유 ${st.credits} 크레딧</p><div class="banner">실제 비용은 전처리 및 입력·출력 토큰에 따라 달라집니다.</div>${button('크레딧 충전 안내',"go('pricing')",'primary')}`)}
const tbl=(rows,kind)=>`<table><tr><th>요금제</th><th>${kind==='edu'?'교육 크레딧':'월 답변'}</th><th>가격</th></tr>${rows.map(([n,q,p])=>`<tr><td>${n}</td><td>${typeof q==='number'?q.toLocaleString():q}</td><td>${p?money(p):'무료'}</td></tr>`).join('')}</table>`;
function pricing(){let sel=st.selected.filter(i=>!(i===1||i===2)||!st.selected.includes(3));let extra=sel.reduce((n,i)=>n+addons[i][2],0)-(sel.includes(1)&&sel.includes(2)?1900:0);return pageTop('요금제 및 결제','기본 상담 구독 + 교육 크레딧 + 추가 기능 + 발송량')+`<div class="tab">${button('상담 요금',"go('pricing')",'on')}${button('전체 기능표',"go('features')")}${button('교육 크레딧',"go('credits')")}${button('추가 기능',"go('addons')")}</div><div class="grid">${card('AI 상담 월 구독',tbl(plans,'chat'))}${card('맞춤 요금 계산',`<label class="label">기본 요금제</label><select onchange="st.plan=+this.value;save();render()">${plans.map(([n,q,p],i)=>`<option value="${i}" ${st.plan===i?'selected':''}>${n} · ${money(p)}</option>`).join('')}</select><div class="stack" style="margin-top:14px">${[0,1,2,10,11,13,15,25].map(i=>`<label class="row between"><span><input class="check" type="checkbox" ${st.selected.includes(i)?'checked':''} onchange="toggleAdd(${i},this.checked)"> ${addons[i][1]}</span><small>${money(addons[i][2])}</small></label>`).join('')}</div><div class="banner">월 예상 결제 <div class="price">${money(plans[st.plan][2]+extra)}</div></div>${button('결제 (연동 준비 중)',"modal('결제 준비 중','실제 결제가 진행되지 않습니다.')",'primary')} ${button('건너뛰기',"go('inbox')")}<p class="muted">교육·문자·알림톡 별도</p>`)}</div>`}
function toggleAdd(i,on){st.selected=on?[...new Set([...st.selected,i,...([11,12,13,14].includes(i)?[10]:[])])]:st.selected.filter(x=>x!==i&&(i!==10||![11,12,13,14].includes(x)));save();render()}
function features(){return pageTop('전체 기능 비교','기본 포함과 별도 결제를 구분합니다.')+card('무료 회원 / 유료 구독',`<table><tr><th>기능</th><th>무료 회원</th><th>유료 구독</th></tr>${['최초 테스트 1회','최초 교육 20크레딧','말투·프롬프트 직접 설정','채팅 미리보기'].map(n=>`<tr><td>${n}</td><td>포함</td><td>포함</td></tr>`).join('')}${common.filter(n=>!n.includes('말투')&&!n.includes('프롬프트')).map(n=>`<tr><td>${n}</td><td>—</td><td>기본 포함</td></tr>`).join('')}${['외부 채널 연동','예약·일정 관리','CRM·업무 관리','고급 알림·디자인','고성능 AI 추가 교육'].map(n=>`<tr><td>${n}</td><td>제한/별도</td><td>추가 결제</td></tr>`).join('')}</table>${button('추가 기능 요금표',"go('addons')",'primary')}`)}
function credits(){return pageTop('AI 교육 크레딧','직접 입력은 무료, 고성능 AI 분석은 별도 크레딧 차감.')+card('교육 충전 요금',tbl(edu,'edu')+`<p class="muted" style="margin-top:10px">예상 사용량 및 차감 상한을 확인한 뒤 교육을 시작합니다.</p>${button('교육 비용 예시',"go('estimate')")}`)}
function addPage(){return pageTop('추가 기능 요금표','필요한 기능만 개별 구매하거나 패키지로 구성합니다.')+['채널·디자인','예약·일정','고객·업무','알림'].map(g=>card(g,`<table>${addons.filter(a=>a[0]===g).map(a=>`<tr><td>${a[1]}</td><td>월 ${money(a[2])}</td></tr>`).join('')}</table>`)).join('')+card('패키지 및 발송량','<p>채널 9,900원 · 예약 12,900원 · 고객 9,900원 · 업무 14,900원 · 디자인 9,900원 · 알림 4,900원 · ALL-IN-ONE 39,900원 (포함 범위 확정 필요)</p><p>알림톡 100건 2,900원 / SMS 100건 3,900원부터</p>')}
function customers(){return pageTop('고객·업무 관리','상담에서 수집된 업무 요청을 정리합니다.')+card('유료 모듈 미리보기','<table><tr><th>업무</th><th>상태</th></tr><tr><td>스냅 견적 요청</td><td>확인 대기</td></tr><tr><td>방문 상담 예약</td><td>확정</td></tr><tr><td>앱 오류 신고</td><td>담당자 전달 필요</td></tr></table>'+button('추가 기능 보기',"go('addons')"))}
function render(){let p=location.hash.slice(1)||'home';let views={inbox,education,style:stylePage,preview:()=>preview(false),test:()=>preview(true),calendar,fields,confirm,channels,alerts,settings,pricing,features,credits,addons:addPage,customers,estimate};$('#app').innerHTML=p==='home'?home():p==='public'?`<div class="public">${phone(false)}</div>`:shell(p,(views[p]||inbox)());window.scrollTo(0,0)}window.addEventListener('hashchange',render);render();
</script></body></html>
