name: Product regression
on:
  push:
    branches: ['feat/product-functions', 'feat/pricing-increase-1127']
  pull_request:
    branches: ['main']
permissions:
  contents: read
concurrency:
  group: csai-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEMO_MODE: '1'
      SHARED_TEST_MODE: '0'
      CSAI_DB_BACKEND: sqlite
      OPENAI_API_KEY: ''
      ENABLE_LIVE_EMAIL: '0'
      ENABLE_CHANNEL_WEBHOOKS: '0'
      OPERATOR_OWNERS: ''
      OPERATOR_EMAILS: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all application sources
        run: python -m compileall -q -x '/(\.git|node_modules|reference|verification)/' .
      - name: Check browser scripts
        run: |
          node --check web/app.js
          node --check web/db-motion.js
          node tests/test_db_motion.js
          node --check web/setup-guide.js
          node --check web/memory-preview-worker.js
          node --check web/widget.js
          node --check web/push-sw.js
      - name: Run SQLite regression tests
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=regression.xml 2>&1 | tee regression.log
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-regression-report
          path: |
            regression.xml
            regression.log
          if-no-files-found: ignore
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEMO_MODE: '1'
      SHARED_TEST_MODE: '0'
      CSAI_DB_BACKEND: postgres
      CSAI_DISPOSABLE_DB: '1'
      DATABASE_URL: postgresql://csai_ci:local-ci-only@127.0.0.1:5432/csai_ci?sslmode=require
      OPENAI_API_KEY: ''
      ENABLE_BACKGROUND_WORKER: '0'
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start disposable PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE csai_ci LOGIN PASSWORD 'local-ci-only'"
          sudo -u postgres createdb -O csai_ci csai_ci
          sudo -u postgres psql -d csai_ci -v ON_ERROR_STOP=1 -c "CREATE SCHEMA csai_private AUTHORIZATION csai_ci; REVOKE ALL ON SCHEMA csai_private FROM PUBLIC;"
      - run: python -m pip install -r requirements.txt
      - name: PostgreSQL smoke
        run: |
          set -o pipefail
          python scripts/postgres_smoke.py 2>&1 | tee postgres-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-smoke-report
          path: postgres-smoke.log
          if-no-files-found: ignore
