name: Product regression
on:
  push:
    branches: ['feat/product-functions']
  pull_request:
    branches: ['main']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DEMO_MODE: '1'
      SHARED_TEST_MODE: '0'
      OPENAI_API_KEY: ''
      ENABLE_LIVE_EMAIL: '0'
      ENABLE_CHANNEL_WEBHOOKS: '0'
      OPERATOR_OWNERS: ''
      OPERATOR_EMAILS: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py store.py ai.py branding.py billing.py developer_api.py education_url.py
      - run: node --check web/app.js
      - run: python -m pytest -q
